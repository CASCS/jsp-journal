{{ $current := . }}
{{ $logo := site.Params.logo | default "/images/logo.svg" }}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <img class="brand__logo" src="{{ $logo | relURL }}" alt="" width="36" height="36">
      <span class="brand__name">{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
