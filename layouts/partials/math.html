{{- if and (eq .Kind "page") (strings.Contains .RawContent "$") }}
<link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}">
<script defer src="{{ "katex/katex.min.js" | relURL }}"></script>
<script defer src="{{ "katex/auto-render.min.js" | relURL }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var go = function () {
    if (!window.renderMathInElement) return setTimeout(go, 50);
    document.querySelectorAll(".abstract, .prose").forEach(function (el) {
      renderMathInElement(el, {
        delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
        throwOnError: false
      });
    });
  };
  go();
});
</script>
{{- end }}
