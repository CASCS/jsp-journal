# Configuración de Decap CMS.

backend:
  name: github
  repo: CASCS/jsp-journal # Cámbialo por tu repositorio de GitHub
  branch: main

  # Si en lugar de OAuth de GitHub usas Netlify Identity + Git Gateway,
  # sustituye todo el bloque backend por:
  #   backend:
  #     name: git-gateway
  #     branch: main

# Para editar en local con `npx decap-server` + `hugo server`:
local_backend: true

# Descomenta para que cada cambio pase por borrador > revisión > publicado (usa pull requests):
# publish_mode: editorial_workflow

locale: es
media_folder: static/uploads
public_folder: /uploads

collections:
  - name: articles
    label: Artículos
    label_singular: Artículo
    folder: content/articles
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields.zenodo_id}}"
    summary: "Vol. {{volume}}, Núm. {{issue}} · {{title}}"
    sortable_fields: ["date", "volume", "issue", "title"]
    editor:
      preview: false
    fields:
      - { label: Título, name: title, widget: string }
      - {
          label: Fecha de publicación,
          name: date,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - {
          label: Borrador (no publicar),
          name: draft,
          widget: boolean,
          default: false,
          required: false,
        }
      - label: Tipo de artículo
        name: article_type
        widget: select
        options:
          [
            "Research Article",
            "Review Article",
            "Short Communication",
            "Brief Report",
          ]
        default: "Research Article"
      - {
          label: Volumen,
          name: volume,
          widget: number,
          value_type: int,
          min: 1,
        }
      - { label: Número, name: issue, widget: number, value_type: int, min: 1 }
      - label: Número de registro de Zenodo
        name: zenodo_id
        widget: string
        pattern: ['^\d+$', "Solo dígitos"]
        hint: "Los dígitos finales del DOI. Ejemplo: 10.5281/zenodo.6992436 → 6992436. Usa el DOI general (concept DOI), que no cambia con las versiones nuevas. Define la dirección web (/articles/6992436/), completa el DOI y forma el ARK (ark:/57464/jsp/v1.i1/6992436). No lo cambies después de publicar."
      - label: Autores
        name: authors
        widget: list
        summary: "{{fields.family}}, {{fields.given}}"
        fields:
          - {
              label: Nombre(s),
              name: given,
              widget: string,
              hint: "Nombre de pila. Ejemplo: Yonathan",
            }
          - {
              label: Apellido(s),
              name: family,
              widget: string,
              hint: "Ejemplo: Smoak",
            }
          - {
              label: Afiliación,
              name: affiliation,
              widget: string,
              required: false,
            }
          - label: ORCID
            name: orcid
            widget: string
            required: false
            hint: "Solo el identificador, por ejemplo 0000-0002-1825-0097"
            pattern:
              ['^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$', "Formato: 0000-0000-0000-0000"]
          - {
              label: Nombre completo (formato anterior),
              name: name,
              widget: hidden,
              required: false,
            }
      - label: DOI actual (Zenodo)
        name: doi
        widget: string
        required: false
        hint: "Déjalo vacío: se completa solo con el número de Zenodo. Úsalo únicamente si el DOI no es de Zenodo."
        pattern: ['^10\.\d{4,9}/\S+$', "Formato: 10.xxxx/xxxxx"]
      - label: ARK (opcional)
        name: ark
        widget: string
        required: false
        hint: "Déjalo vacío: se genera solo con el volumen, el número y el número de Zenodo. Escríbelo solo si el artículo ya tiene un ARK que no sigue ese patrón."
      - {
          label: DOI anterior (inhabilitado),
          name: legacy_doi,
          widget: string,
          required: false,
        }
      - {
          label: URL del PDF en Zenodo,
          name: pdf_url,
          widget: string,
          required: false,
          hint: "Enlace directo al archivo, el que termina en .pdf",
        }
      - {
          label: Tamaño del PDF,
          name: pdf_size,
          widget: string,
          required: false,
          hint: "Ejemplo: 1,2 MB",
        }
      - {
          label: URL del registro de Zenodo,
          name: zenodo_url,
          widget: string,
          required: false,
          hint: "Si se deja vacío, se deduce del DOI",
        }
      - label: Licencia
        name: license
        widget: select
        options:
          [
            "CC BY 4.0",
            "CC BY-SA 4.0",
            "CC BY-NC 4.0",
            "CC BY-NC-SA 4.0",
            "CC BY-ND 4.0",
            "CC BY-NC-ND 4.0",
            "CC0 1.0",
          ]
        default: "CC BY 4.0"
      - label: Idioma
        name: language
        widget: select
        options:
          - { label: Español, value: es }
          - { label: Inglés, value: en }
          - { label: Português, value: pt }
          - { label: Francés, value: fr }
        default: es
      - { label: Palabras clave, name: keywords, widget: list, required: false }
      - label: Direcciones antiguas (redirigen al artículo)
        name: aliases
        widget: list
        required: false
        hint: "Solo para artículos que cambiaron de dirección. Ejemplo: /articles/titulo-largo-anterior/"
      - { label: Resumen, name: body, widget: markdown }

  - name: pages
    label: Páginas nuevas
    label_singular: Página
    folder: content/pages
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: Título, name: title, widget: string }
      - {
          label: Borrador (no publicar),
          name: draft,
          widget: boolean,
          default: false,
          required: false,
        }
      - label: Mostrar en el menú principal
        name: menus
        widget: select
        required: false
        options:
          - { label: "Sí, mostrar en el menú", value: main }
      - label: Mostrar como submenú de
        name: menu_parent
        widget: select
        required: false
        options:
          - { label: Acerca de, value: "/about/" }
          - { label: Normas para autores, value: "/author-guidelines/" }
          - { label: Artículos, value: "/articles/" }
        hint: "Si eliges una página, esta aparece dentro de su menú desplegable. En ese caso deja vacío «Mostrar en el menú principal»."
      - label: Posición en el menú
        name: weight
        widget: number
        value_type: int
        default: 40
        required: false
        hint: "Menor = más a la izquierda. Los menús fijos usan 10, 20 y 30."
      - { label: Contenido, name: body, widget: markdown }

  - name: paginas
    label: Páginas
    files:
      - label: Portada (texto de presentación)
        name: portada
        file: content/_index.md
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Contenido, name: body, widget: markdown }
      - label: Acerca de
        name: acerca
        file: content/about.md
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Contenido, name: body, widget: markdown }
      - label: Normas para autores
        name: normas
        file: content/author-guidelines.md
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Contenido, name: body, widget: markdown }

      - label: Indexación (logos de la portada y de About)
        name: indexing
        file: data/indexing.yaml
        fields:
          - label: Servicios
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Nombre, name: name, widget: string }
              - {
                  label: Enlace,
                  name: url,
                  widget: string,
                  hint: "Página de la revista en ese servicio o, si no la tienes, la página principal del servicio",
                }
              - {
                  label: Logo,
                  name: logo,
                  widget: image,
                  required: false,
                  hint: "Logo oficial del servicio. Si se deja vacío, se muestra el nombre como texto.",
                }
